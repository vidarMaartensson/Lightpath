<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="See which customers lose service when fibre sites go down." />
    <meta name="theme-color" content="#f2f5f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1a22" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%230e8fa6'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%230e8fa6' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Lightpath</title>
    <script>
      // Set the theme before first paint so the page never flashes the wrong one.
      // Same lookup as src/lib/theme.ts: the user's choice, else the system.
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem("lightpath-theme");
        } catch (e) {}
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (choice === "light" || choice === "dark") {
          var paper = dark ? "#0c1a22" : "#f2f5f6";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute("content", paper);
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
